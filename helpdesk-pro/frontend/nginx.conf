server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # La API se sirve desde el mismo origen: no hace falta CORS en producción.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /swagger-ui/ {
        proxy_pass http://backend:8080;
    }

    location /v3/api-docs {
        proxy_pass http://backend:8080;
    }

    # Assets con hash en el nombre: se pueden cachear "para siempre".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida devuelve index.html y la resuelve React Router.
    location / {
        try_files $uri /index.html;
    }
}
