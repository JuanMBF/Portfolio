<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Juan Barros</title>
  <meta name="description" content="Página no encontrada.">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/Portfolio/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/Portfolio/estilos.css">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("tema");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <main id="contenido" class="contenedor error-404">
    <p class="antetitulo">Error 404</p>
    <h1>Esta página no existe</h1>
    <p class="bajada">Puede que el enlace esté mal escrito o que la página se haya movido.</p>
    <div class="acciones">
      <a class="boton boton--primario" href="/Portfolio/">Ir al portfolio</a>
      <a class="boton" href="https://juanmbf.github.io/InflationArg/">Ver InflationArg</a>
    </div>
  </main>
</body>
</html>
