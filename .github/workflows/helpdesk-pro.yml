name: HelpDesk Pro

on:
  push:
    paths: ["helpdesk-pro/**", ".github/workflows/helpdesk-pro.yml"]
  pull_request:
    paths: ["helpdesk-pro/**", ".github/workflows/helpdesk-pro.yml"]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (Java 21 + Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helpdesk-pro/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests unitarios e integración
        run: ./mvnw -B verify
      - name: Reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: helpdesk-pro/backend/target/site/jacoco

  frontend:
    name: Frontend (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: helpdesk-pro/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: helpdesk-pro/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Stack completo con Docker Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    defaults:
      run:
        working-directory: helpdesk-pro
    steps:
      - uses: actions/checkout@v4
      - name: Construir y levantar MySQL + API + nginx
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Prueba de humo a través de nginx
        run: |
          curl -fsS http://localhost:3000/ | grep -q "<title>HelpDesk Pro</title>"
          TOKEN=$(curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"lucia@helpdesk.dev","password":"Agent123!"}' | jq -r .token)
          curl -fsS http://localhost:3000/api/dashboard -H "Authorization: Bearer $TOKEN" | jq -e '.totalTickets == 16'
      - name: Logs si algo falla
        if: failure()
        run: docker compose logs
      - name: Apagar
        if: always()
        run: docker compose down -v
