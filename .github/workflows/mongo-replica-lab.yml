name: Mongo Replica Lab

on:
  push:
    paths: ["mongo-replica-lab/**", ".github/workflows/mongo-replica-lab.yml"]
  pull_request:
    paths: ["mongo-replica-lab/**", ".github/workflows/mongo-replica-lab.yml"]
  workflow_dispatch:

jobs:
  unit:
    name: Tests unitarios
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mongo-replica-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests

  replica-set:
    name: Replica set real + caída del primario
    runs-on: ubuntu-latest
    needs: unit
    defaults:
      run:
        working-directory: mongo-replica-lab
    steps:
      - uses: actions/checkout@v4
      - name: Levantar los 3 nodos e iniciar el replica set
        run: make up
      - name: Cargar 10.000 documentos y verificar los 3 nodos
        run: make load
      - name: Matar el primario mientras se escribe
        run: make crash
      - name: Verificar que los nodos volvieron a coincidir
        run: make verify
      - name: Logs si algo falla
        if: failure()
        run: docker compose logs
      - name: Apagar
        if: always()
        run: docker compose down -v
