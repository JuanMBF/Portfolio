# Replica set de MongoDB con 3 nodos + contenedor de inicialización + herramientas de prueba.
x-mongo-node: &mongo-node
  image: mongo:7.0
  command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
  healthcheck:
    test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
    interval: 5s
    timeout: 5s
    retries: 20

services:
  mongo1:
    <<: *mongo-node
    hostname: mongo1
    ports: ["27017:27017"]
    volumes: ["mongo1-data:/data/db"]

  mongo2:
    <<: *mongo-node
    hostname: mongo2
    ports: ["27018:27017"]
    volumes: ["mongo2-data:/data/db"]

  mongo3:
    <<: *mongo-node
    hostname: mongo3
    ports: ["27019:27017"]
    volumes: ["mongo3-data:/data/db"]

  # Inicia el replica set una sola vez (si ya existe, no hace nada) y termina.
  init:
    image: mongo:7.0
    depends_on:
      mongo1: { condition: service_healthy }
      mongo2: { condition: service_healthy }
      mongo3: { condition: service_healthy }
    volumes: ["./scripts/init-replica-set.js:/init-replica-set.js:ro"]
    entrypoint: ["mongosh", "--host", "mongo1:27017", "--quiet", "/init-replica-set.js"]
    restart: "no"

  # Herramientas en Python (carga, verificación y failover). Se usan con `docker compose run --rm lab ...`
  lab:
    build: ./lab
    profiles: ["tools"]
    environment:
      MONGO_HOSTS: mongo1:27017,mongo2:27017,mongo3:27017
      MONGO_REPLICA_SET: rs0

volumes:
  mongo1-data:
  mongo2-data:
  mongo3-data:
